<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="8" width="26" height="12" rx="6" ry="6"></rect>
          <path d="M6 20h20v4H6z"></path>
          <circle cx="11" cy="25" r="2.3"></circle>
          <circle cx="21" cy="25" r="2.3"></circle>
        </svg>
      </div>
      <div>
        <p class="brand-title">Smart Parking</p>
        <p class="brand-subtitle">Quản lý bãi đỗ xe</p>
      </div>
    </div>

    <nav class="sidebar__nav">
      <p class="menu-label">Điều hướng</p>
      <ul>
        <li *ngFor="let item of primaryNavigation; trackBy: trackByLabel">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
          >
            <span class="nav-icon">
              <ng-container [ngSwitch]="item.icon">
                <svg *ngSwitchCase="'overview'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 4h8v8H4zM4 14h8v6H4zM14 4h6v5h-6zM14 11h6v9h-6z"></path>
                </svg>
                <svg *ngSwitchCase="'map'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 3 4 5v16l6-2 6 2 4-2V3l-6 2-6-2z"></path>
                  <path d="M10 5v14"></path>
                  <path d="M14 7v14"></path>
                </svg>
                <svg *ngSwitchCase="'car'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.5 14.5 5.7 9h12.6l2.2 5.5"></path>
                  <rect x="5" y="14" width="14" height="5" rx="2"></rect>
                </svg>
                <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 21h18"></path>
                  <path d="M6 10v11"></path>
                  <path d="M12 4v17"></path>
                  <path d="M18 13v8"></path>
                </svg>
                <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"></path>
                  <path
                    d="M19.4 14.5a6 6 0 0 0 0-5l1.8-1-2-3.5-2.1.6a6.21 6.21 0 0 0-2.4-1.3L14.3 2h-4.6l-.4 2.3a6.21 6.21 0 0 0-2.4 1.3l-2.1-.6-2 3.5 1.8 1a6 6 0 0 0 0 5l-1.8 1 2 3.5 2.1-.6a6.21 6.21 0 0 0 2.4 1.3l.4 2.3h4.6l.4-2.3a6.21 6.21 0 0 0 2.4-1.3l2.1.6 2-3.5z"
                  ></path>
                </svg>
              </ng-container>
            </span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar__footer">
      <button type="button" class="nav-link is-settings">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"></path>
            <path
              d="M19.4 14.5a6 6 0 0 0 0-5l1.8-1-2-3.5-2.1.6a6.21 6.21 0 0 0-2.4-1.3L14.3 2h-4.6l-.4 2.3a6.21 6.21 0 0 0-2.4 1.3l-2.1-.6-2 3.5 1.8 1a6 6 0 0 0 0 5l-1.8 1 2 3.5 2.1-.6a6.21 6.21 0 0 0 2.4-1.3l.4 2.3h4.6l.4-2.3a6.21 6.21 0 0 0 2.4-1.3l2.1.6 2-3.5z"
            ></path>
          </svg>
        </span>
        <span>Cài đặt</span>
      </button>
    </div>
  </aside>

  <section class="content-area">
    <router-outlet />
  </section>
</div>
